name: Verify published BOMB RUN

on:
  push:
    branches: [main]
    paths:
      - 'deployment-checks/**'
      - '.github/workflows/deploy-bomb-run.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bomb-run-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verification tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check out compiled site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: gh-pages
          path: _published-site
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deployment-checks/package-lock.json
      - name: Install locked verification tools
        working-directory: deployment-checks
        run: npm ci
      - name: Audit compiled source exposure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-checks/dist
          git -C _published-site archive HEAD | tar -x -C deployment-checks/dist
          cd deployment-checks
          npm run audit:build
      - name: Install browser
        working-directory: deployment-checks
        run: npx playwright install --with-deps chromium
      - name: Confirm expected release is live
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./deployment-checks/release.json').sourceCommit")"
          for attempt in {1..36}; do
            if curl --fail --silent --show-error "https://vandiddong.github.io/meowwoof-server/build.json?release=${expected}&attempt=${attempt}" -o "$RUNNER_TEMP/bomb-run-public-build.json" && grep -q "$expected" "$RUNNER_TEMP/bomb-run-public-build.json"; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::The expected compiled release is not live.'
          exit 1
      - name: Verify public five-round game, audio and mobile controls
        working-directory: deployment-checks
        env:
          BOMB_RUN_TEST_URL: https://vandiddong.github.io/meowwoof-server/
        run: npm run test:browser
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bomb-run-public-verification
          path: |
            deployment-checks/browser-report.json
            deployment-checks/screenshots/
          retention-days: 14
